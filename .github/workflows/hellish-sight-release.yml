name: Hellish Sight Release

# Hellish Sight (vanilla Minecraft Legacy Console mod hub): builds the Windows client and publishes it as a GitHub release.
# The version number lives in HELLISH_SIGHT_VERSION.
#  - Push to main            -> release  v<version>            (marked latest)
#  - Push to feature/**      -> pre-release v<version>-rc<run>  (test build, never latest)
#  - Push a tag v*           -> release with that tag (suffix like -rc1 => pre-release)
#  - Run manually            -> build + workflow artifact only
#
# The Emerald Legacy Launcher installs this version from:
#   https://github.com/RiqueBitt/hellish-sight/releases/latest/download/HellishSightWindows64.zip

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'feature/**'
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: hellish-sight-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      ZIP_NAME: HellishSightWindows64.zip

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Build client (Release)
      uses: lukka/run-cmake@v10
      env:
        VCPKG_ROOT: "" # Disable vcpkg for CI builds
      with:
        configurePreset: windows64
        buildPreset: windows64-release
        buildPresetAdditionalArgs: "['--target', 'Minecraft.Client', '--', '-k', '0']"

    - name: Report compile errors
      # GitHub only shows 10 annotations per step, so on failure rebuild the failed
      # files (incremental, fast) and post the full error list as a commit comment.
      if: failure()
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cmake --build --preset windows64-release --target Minecraft.Client -- -k 0 2>&1 | Tee-Object -FilePath build-errors.log | Out-Null
        $errs = Select-String -Path build-errors.log -Pattern 'error C\d+|error LNK\d+|fatal error' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
        $errs = $errs | ForEach-Object { $_ -replace '^.*?\\(RubyLauncher|Minecraft\.[A-Za-z]+)\\', '$1/' }
        $body = "Compile errors (" + $errs.Count + "):`n``````n" + (($errs | Select-Object -First 200) -join "`n") + "`n``````"
        $body | Out-File -Encoding utf8 body.txt
        gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.txt | Out-Null
        Write-Host $body

    - name: Verify build output
      shell: pwsh
      run: |
        $out = "./build/windows64/Minecraft.Client/Release"
        if (-not (Test-Path "$out/Minecraft.Client.exe")) { throw "Minecraft.Client.exe was not produced" }
        Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize

    - name: Add licence notices
      shell: pwsh
      run: Copy-Item Minecraft.Client/Windows64/ShaderPack_MakeUp_LICENSE.txt ./build/windows64/Minecraft.Client/Release/

    # Hellish Sight: "Servidores Java" - Reunion proxy (AGPL-3.0) + a trimmed Java runtime
    - name: Setup Java 22
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '22'

    - name: Build Reunion proxy and runtime
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $commit = '7ed335db6e00c9ad7ef8fb892a7038df5c8e4053'
        git clone --filter=blob:none https://github.com/Briiqn/Reunion.git reunion-src
        git -C reunion-src checkout $commit
        Push-Location reunion-src
        ./gradlew.bat shadowJar --no-daemon -q
        Pop-Location
        $jar = Get-ChildItem reunion-src/build/libs/*.jar | Where-Object { $_.Name -notlike 'reunion-api*' } | Sort-Object Length -Descending | Select-Object -First 1
        if (-not $jar) { throw 'Reunion jar not found' }
        $dst = './build/windows64/Minecraft.Client/Release/javaproxy'
        New-Item -ItemType Directory -Force -Path $dst | Out-Null
        Copy-Item $jar.FullName "$dst/reunion.jar"
        Copy-Item reunion-src/LICENSE "$dst/REUNION_LICENSE.txt"
        $modules = 'java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.management,jdk.net,jdk.unsupported,jdk.zipfs,jdk.httpserver,jdk.naming.dns,jdk.localedata,jdk.charsets'
        & "$env:JAVA_HOME/bin/jlink.exe" --add-modules $modules --strip-debug --no-header-files --no-man-pages --compress zip-6 --output "$dst/jre"
        if (-not (Test-Path "$dst/jre/bin/java.exe")) { throw 'jlink failed' }
        @"
        Reunion - LCE <-> Java Edition proxy, used by Hellish Sight for "Servidores Java".
        Copyright (C) Briiqn, licensed under the GNU Affero General Public License v3.0 (REUNION_LICENSE.txt).
        Source code of this exact build: https://github.com/Briiqn/Reunion/tree/$commit
        The runtime in jre/ is Eclipse Temurin (OpenJDK, GPLv2 with Classpath Exception).
        config.yml is rewritten by the game every time you connect.
        "@ | Set-Content "$dst/README.txt"

    - name: Zip build
      run: 7z a -r ${{ env.ZIP_NAME }} ./build/windows64/Minecraft.Client/Release/* "-x!*.ipdb" "-x!*.iobj" "-x!*.lib" "-x!*.exp"  # Minecraft.Client.pdb is kept for crash reports

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: hellish-sight-windows64
        path: ${{ env.ZIP_NAME }}
        retention-days: 7

    - name: Compute release tag
      id: rel
      shell: pwsh
      run: |
        $ver = (Get-Content HELLISH_SIGHT_VERSION -Raw).Trim()
        $ref = "${{ github.ref }}"
        if ($ref -like "refs/tags/v*") {
          $tag = "${{ github.ref_name }}"
        } elseif ($ref -eq "refs/heads/main") {
          $tag = "v$ver"
        } elseif ($ref -like "refs/heads/feature/*") {
          $tag = "v$ver-rc${{ github.run_number }}"
        } else {
          $tag = ""
        }
        $pre = if ($tag -match "-") { "true" } else { "false" }
        $latest = if ($pre -eq "true") { "false" } else { "true" }
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "prerelease=$pre" >> $env:GITHUB_OUTPUT
        "latest=$latest" >> $env:GITHUB_OUTPUT
        Write-Host "Release tag: '$tag' (prerelease=$pre)"

    - name: Publish release
      if: steps.rel.outputs.tag != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.rel.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: Hellish Sight ${{ steps.rel.outputs.tag }}
        files: ${{ env.ZIP_NAME }}
        prerelease: ${{ steps.rel.outputs.prerelease }}
        make_latest: ${{ steps.rel.outputs.latest }}
        body: |
          **Hellish Sight 2.0 (in development)** — vanilla Minecraft (no extra blocks, biomes or textures) + Lua mod loader + big-world rewrite (sparse chunk table, region-file saves, Java-style Far Lands).
          Mods draw their own HUD through the `hud` Lua API — e.g. **Glance** is a separate Workshop mod.
          Test builds may corrupt worlds: back up your saves.

          ### Install
          - **Emerald Legacy Launcher:** Workshop → Versions → *Hellish Sight* → Install. Then install mods (e.g. **Glance**) choosing *Hellish Sight*.
          - **Manual:** extract `${{ env.ZIP_NAME }}` to a folder and run `Minecraft.Client.exe`. Put mods in the `mods` folder next to it.

          Requires Windows 7+ and a DirectX 11 GPU. Based on vanilla [MinecraftConsoles](https://github.com/smartcmd/MinecraftConsoles); Lua mod loader (Ruby Launcher) from [Hellish Ends](https://github.com/deadvoxelx/ThatModdedRepo) by DeadVoxelx.
